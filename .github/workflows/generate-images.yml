name: Шог зураг үүсгэх (Gemini)

# GitHub → Actions → "Шог зураг үүсгэх (Gemini)" → Run workflow
# Шаардлага: Settings → Secrets and variables → Actions → New repository secret
#            Name: GEMINI_API_KEY, Secret: таны Gemini API түлхүүр
on:
  # Үг нэмэгдэх эсвэл workflow шинэчлэгдэхэд автоматаар дутуу зургийг үүсгэнэ
  push:
    branches: [main]
    paths:
      - 'data/source/**'
      - 'scripts/generate_images.py'
      - '.github/workflows/generate-images.yml'
      - '.github/trigger-images'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Хэдэн зураг үүсгэх (0 = дутуу бүгдийг)'
        required: false
        default: '0'
      ids:
        description: 'Зөвхөн эдгээр id-г дахин үүсгэх (жишээ: 3 17 42). Хоосон бол алгасна'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: generate-images
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Generate images
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          ARGS=""
          LIMIT="${{ inputs.limit }}"; IDS="${{ inputs.ids }}"
          # push-ээр ажиллахад .github/trigger-images доторх LIMIT= / IDS= мөрийг уншина
          if [ -z "$LIMIT" ] && [ -f .github/trigger-images ]; then
            LIMIT=$(grep -oP '^LIMIT=\K[0-9]+' .github/trigger-images || true)
            IDS=$(grep -oP '^IDS=\K[0-9 ]+' .github/trigger-images || true)
          fi
          if [ -n "$LIMIT" ] && [ "$LIMIT" != "0" ]; then ARGS="$ARGS --limit $LIMIT"; fi
          if [ -n "$IDS" ]; then ARGS="$ARGS --force --ids $IDS"; fi
          python3 scripts/generate_images.py $ARGS || echo "generate_images.py алдаатай дууслаа (images/_report.json-ийг үз)"
      - name: Commit images and report
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898729+github-actions[bot]@users.noreply.github.com"
          git add images/
          if git diff --cached --quiet; then echo "Шинэ зураг алга"; exit 0; fi
          git commit -m "Шог зураг нэмэв ($(git diff --cached --name-only | wc -l) файл)"
          git pull --rebase origin main
          git push origin main
